name: Deploy

on:
  push:
    branches:
      - beta
      - live

concurrency:
  group: firebase-hosting-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.site.outputs.url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAOCODE_COM }}
          TARGET: ${{ github.ref_name }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          # Branch name matches the Hosting target: beta → beta-taocode-com, live → taocode-com.
          npx --yes firebase-tools@latest deploy --only "hosting:$TARGET" --project taocode-com --non-interactive

      - name: Record site URL
        id: site
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            live) url="https://www.taocode.com" ;;
            beta) url="https://beta.taocode.com" ;;
            *) echo "No public URL for branch $BRANCH" >&2; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Production deploy succeeded"
            echo "[$url]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
