name: Deploy

on:
  push:
    branches:
      - beta
      - live

concurrency:
  group: firebase-hosting-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.hosting.outputs.details_url }}
    permissions:
      checks: write
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Firebase Hosting
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TAOCODE_COM }}
          projectId: taocode-com
          # Branch name matches the Hosting target: beta → beta-taocode-com, live → taocode-com.
          # channelId live publishes that site's production channel (not a preview channel).
          target: ${{ github.ref_name }}
          channelId: live
